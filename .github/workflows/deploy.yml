name: Deploy Freqtrade to Cloud

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/freqtrade
  
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install freqtrade
          pip install pytest pytest-cov
      
      - name: Validate strategy
        run: |
          freqtrade test-strategy \
            --strategy AdvancedFuturesSwingStrategy \
            --config user_data/config.json
      
      - name: Run backtests
        run: |
          freqtrade backtesting \
            --strategy AdvancedFuturesSwingStrategy \
            --config user_data/config.json \
            --timerange 20240101-20240201 \
            --export trades
  
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name freqtrade-staging-cluster \
            --region us-east-1
      
      - name: Deploy to Kubernetes
        run: |
          # Update image in deployment
          kubectl set image deployment/freqtrade \
            freqtrade=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:main \
            -n freqtrade-staging
          
          # Wait for rollout
          kubectl rollout status deployment/freqtrade \
            -n freqtrade-staging \
            --timeout=5m
      
      - name: Verify deployment
        run: |
          kubectl get pods -n freqtrade-staging
          kubectl get svc -n freqtrade-staging
      
      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30
          
          # Test API endpoint
          STAGING_URL=$(kubectl get svc freqtrade -n freqtrade-staging -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f http://${STAGING_URL}:8080/api/v1/ping || exit 1
  
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/production'
    environment: 
      name: production
      url: https://freqtrade.yourdomain.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name freqtrade-cluster \
            --region us-east-1
      
      - name: Create database backup
        run: |
          kubectl exec -n freqtrade \
            deployment/postgres -- \
            pg_dump -U freqtrade freqtrade > backup-pre-deploy.sql
      
      - name: Deploy to Kubernetes
        run: |
          # Update image
          kubectl set image deployment/freqtrade \
            freqtrade=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:production \
            -n freqtrade
          
          # Wait for rollout with longer timeout
          kubectl rollout status deployment/freqtrade \
            -n freqtrade \
            --timeout=10m
      
      - name: Verify deployment
        run: |
          kubectl get pods -n freqtrade
          kubectl logs -n freqtrade deployment/freqtrade --tail=50
      
      - name: Run production health checks
        run: |
          sleep 60
          
          # Check API health
          PROD_URL="https://freqtrade.yourdomain.com"
          curl -f ${PROD_URL}/api/v1/ping || exit 1
          curl -f ${PROD_URL}/api/v1/health || exit 1
      
      - name: Send Telegram notification
        if: success()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚀 <b>Production Deployment Successful</b>%0A%0AVersion: ${{ github.sha }}%0ABranch: ${{ github.ref_name }}%0ADeployed by: ${{ github.actor }}" \
            -d parse_mode="HTML"
      
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/freqtrade -n freqtrade
          
          # Send failure notification
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ <b>Production Deployment Failed</b>%0A%0AVersion: ${{ github.sha }}%0ARolled back to previous version" \
            -d parse_mode="HTML"
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
